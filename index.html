<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="EcoTrack is a smart municipal waste management and environmental operations platform connecting residents, on-ground collectors, and city authorities." />
    <meta name="theme-color" content="#1a1a1a" />
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="EcoTrack" />
    <meta property="og:title" content="EcoTrack — Smart Waste Management & Environmental Operations" />
    <meta property="og:description" content="Right pickup, at the right place, at the right time. Connecting citizens, collectors, and municipal operations teams." />
    <meta property="og:image" content="/og-image.png" />
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="EcoTrack — Smart Waste Management & Environmental Operations" />
    <meta name="twitter:description" content="Connecting citizens, frontline collectors, and municipal operations teams." />
    <meta name="twitter:image" content="/og-image.png" />
    <title>EcoTrack — Smart Waste Operations Platform</title>
    <script>
      // Apply the stored theme before first paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var pref = localStorage.getItem('ecotrack:theme') || 'light'
          var resolved = pref === 'system'
            ? (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
            : pref
          document.documentElement.dataset.theme = resolved === 'light' ? 'light' : 'dark'
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
